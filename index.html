<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forty — Flat-RAM Fortran Compiler, VM &amp; RV32IM Visualizer</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --border: #2b323c;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --rodata: #3b82f6;
      --bss: #22c55e;
      --linkage: #a855f7;
      --scratch: #f59e0b;
      --sys: #6366f1;
      --heap: #14b8a6;
      --stack: #f43f5e;
      --read: #22d3ee;
      --write: #fb923c;
      --trap: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 15px; margin: 0 8px 0 0; color: var(--accent); }
    select, button, input[type="text"] {
      background: #0d1117;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #1f6feb; border-color: #388bfd; }
    label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 10px;
      padding: 10px;
      min-height: calc(100vh - 52px);
    }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    textarea#source {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      background: #0d1117;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      font: inherit;
      line-height: 1.45;
      tab-size: 2;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .scrubber { display: flex; align-items: center; gap: 8px; }
    .scrubber input[type="range"] { flex: 1; }
    .trap-banner {
      padding: 8px 10px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid var(--trap);
      color: #fecaca;
      display: none;
    }
    .trap-banner.active { display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--muted); }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; }
    .ram-wrap { position: relative; }
    .ram-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 5px;
      position: relative;
      z-index: 1;
    }
    .ram-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .cell {
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: 4px;
      padding: 4px 5px;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 50px;
      position: relative;
    }
    .cell[data-role="rodata"] { border-left-color: var(--rodata); }
    .cell[data-role="bss"] { border-left-color: var(--bss); }
    .cell[data-role="linkage_param"],
    .cell[data-role="linkage_ret"] { border-left-color: var(--linkage); }
    .cell[data-role="scratch"] { border-left-color: var(--scratch); }
    .cell[data-role="unused"] { border-left-color: #30363d; opacity: 0.65; }
    .cell.flash-read { outline: 2px solid var(--read); background: rgba(34, 211, 238, 0.14); }
    .cell.flash-write { outline: 2px solid var(--write); background: rgba(251, 146, 60, 0.18); }
    .cell-top { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
    .cell-val { font-size: 14px; font-weight: 700; text-align: center; }
    .cell-lbl { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 1200px) { .split-row { grid-template-columns: 1fr; } }
    .list-box {
      max-height: 240px;
      overflow-y: auto;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px;
    }
    .code-line {
      display: flex;
      gap: 8px;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
      white-space: pre;
    }
    .code-line:hover { background: rgba(88, 166, 255, 0.08); }
    .code-line.active { background: rgba(88, 166, 255, 0.22); outline: 1px solid var(--accent); }
    .code-line.patched { background: rgba(245, 158, 11, 0.22); }
    .ip-num { color: var(--muted); min-width: 34px; }
    .matrix-grid { display: inline-grid; gap: 3px; background: #0d1117; padding: 6px; border-radius: 4px; border: 1px solid var(--border); }
    .mat-cell {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 3px;
      text-align: center;
      min-width: 54px;
    }
    .mat-cell small { display: block; font-size: 9px; color: var(--muted); }
    .regs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 4px; }
    .reg-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
    .tape-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tape-item {
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: #0d1117;
    }
    .tape-item.head { border-color: var(--accent); background: rgba(88, 166, 255, 0.2); }
    .drum-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
    .drum-sec {
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: #0d1117;
      font-size: 10px;
      text-align: center;
    }
    .drum-sec.angle { border-color: var(--scratch); }
    .drum-sec.active { background: rgba(88, 166, 255, 0.22); border-color: var(--accent); }
    .stdout {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      min-height: 44px;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .source-lines {
      max-height: 140px;
      overflow-y: auto;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>forty</h1>
    <a href="./v0/" style="color:var(--accent);text-decoration:none;border:1px solid var(--border);padding:3px 8px;border-radius:4px;">v0 (~200 LoC)</a>
    <label>Demo
      <select id="demoSelect"></select>
    </label>
    <label>Target
      <select id="targetMode">
        <option value="vm">4-Tuple VM</option>
        <option value="riscv">RV32IM Silicon</option>
      </select>
    </label>
    <label>RAM
      <select id="memSize">
        <option value="64">64 words</option>
        <option value="128" selected>128 words</option>
        <option value="256">256 words</option>
      </select>
    </label>
    <label><input type="checkbox" id="protectRodata"> .rodata MMU</label>
  </header>

  <main class="layout">
    <section class="col">
      <div class="card">
        <div class="card-head">
          <span>Source</span>
          <button id="compileBtn" class="primary">Compile</button>
        </div>
        <textarea id="source" spellcheck="false"></textarea>
        <label>Tape Unit 0 Input (comma-separated)
          <input type="text" id="tapeInput" placeholder="e.g. 3, -1, 7, 0, 5" style="width:100%">
        </label>
        <div id="sourceLines" class="source-lines"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span>Execution</span>
          <span id="statusText">Ready</span>
        </div>
        <div class="controls">
          <button id="stepBackBtn">&lt;- Back</button>
          <button id="stepBtn">Step -&gt;</button>
          <button id="runBtn">Run</button>
          <button id="resetBtn">Reset</button>
          <select id="speedSelect">
            <option value="slow">10 steps/s</option>
            <option value="fast" selected>60 steps/s</option>
            <option value="burst">5000/frame</option>
          </select>
        </div>
        <div class="scrubber">
          <span>Step</span>
          <input type="range" id="timeScrubber" min="0" max="0" value="0">
          <span id="stepCount">0</span>
        </div>
        <div id="trapBanner" class="trap-banner"></div>
        <div class="card-head"><span>Stdout</span><span id="cycleCount">cycles: 0</span></div>
        <div id="stdout" class="stdout"></div>
      </div>
    </section>

    <section class="col">
      <div class="card">
        <div class="card-head">
          <span>Diagram 1 — Flat-RAM Tape (MEM[0..N])</span>
          <div class="legend">
            <span><i class="dot" style="background:var(--rodata)"></i>.rodata</span>
            <span><i class="dot" style="background:var(--bss)"></i>.bss</span>
            <span><i class="dot" style="background:var(--linkage)"></i>linkage</span>
            <span><i class="dot" style="background:var(--scratch)"></i>scratch</span>
            <span><i class="dot" style="background:var(--read)"></i>read</span>
            <span><i class="dot" style="background:var(--write)"></i>write</span>
          </div>
        </div>
        <div id="ramWrap" class="ram-wrap">
          <svg id="ramSvg" class="ram-svg"></svg>
          <div id="ramGrid" class="ram-grid"></div>
        </div>
      </div>

      <div class="split-row">
        <div class="card">
          <div class="card-head">
            <span>Diagram 2 — Instructions &amp; Backpatching</span>
            <span id="ipLabel">ip: 0</span>
          </div>
          <div class="scrubber">
            <span>Compile</span>
            <input type="range" id="compileScrubber" min="0" max="0" value="0">
            <span id="compileEventLabel">all</span>
          </div>
          <div id="codeList" class="list-box"></div>
          <div id="regsWrap" style="display:none">
            <div class="card-head" style="margin-top:4px"><span>RV32IM Registers</span></div>
            <div id="regsGrid" class="regs-grid"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><span>Diagram 3 — 2D Matrices &amp; Peripherals</span></div>
          <div id="matrices"></div>
          <div id="tapes"></div>
          <div id="drum"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./visualizer.js"></script>
</body>
</html>
