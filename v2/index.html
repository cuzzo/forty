<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>forty v2 — Drum</title>
  <style>
    body { margin: 16px; font: 13px/1.4 monospace; background: #0e1116; color: #e6edf3; }
    .row { position: relative; display: grid; grid-template-columns: 320px 260px 1fr; gap: 24px; margin-top: 10px; align-items: start; }
    #arrow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .editor { position: relative; height: 260px; }
    .editor textarea, #lines { position: absolute; inset: 0; margin: 0; box-sizing: border-box; border: 1px solid #30363d; font: inherit; line-height: 18px; }
    .editor textarea { z-index: 1; background: transparent; color: #e6edf3; padding: 8px 8px 8px 3ch; resize: none; white-space: pre; overflow: auto; }
    #lines { overflow: hidden; background: #161b22; padding: 8px 0; color: #22c55e; font-weight: 700; }
    #lines .line { display: block; height: 18px; padding: 0 0 0 1ch; cursor: default; }
    #lines .line.hover, #code .line.hover { background: rgba(250, 204, 21, 0.25); }
    #ram .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; }
    #ram .code-strip { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 6px; }
    .cell { padding: 6px; border: 1px solid #30363d; border-left: 3px solid #8b949e; background: #161b22; display: flex; flex-direction: column; }
    .cell.code { width: 5ch; padding: 0 3px; border-left-width: 2px; border-left-color: #6e7681; background: #21262d; color: #8b949e; font-size: 10px; line-height: 14px; text-align: right; }
    .cell.pc { background: #1f6feb; }
    .cell.unused { opacity: 0.35; }
    .cell.rodata { border-left-color: #3b82f6; }
    .cell.bss { border-left-color: #22c55e; }
    .cell.linkage { border-left-color: #a855f7; }
    .cell.scratch { border-left-color: #f59e0b; }
    .cell.read { outline: 2px solid #22d3ee; }
    .cell.write { outline: 2px solid #fb923c; }
    .line { padding: 2px 6px; white-space: pre; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .line.active { background: #1f6feb; }
    #code, pre { background: #161b22; border: 1px solid #30363d; padding: 6px; max-height: 260px; overflow: auto; margin: 6px 0 0; }
    #code { margin-top: 0; max-height: 440px; }
    .head { color: #8b949e; font-weight: 700; margin: 6px 0 4px; }
    .bar { display: flex; align-items: center; gap: 4px; }
    .legend { margin-left: auto; display: flex; gap: 12px; color: #8b949e; }
    .legend i { display: inline-block; width: 3px; height: 12px; margin-right: 5px; vertical-align: middle; }
    .legend i.box { width: 10px; height: 10px; background: none; }
    #drum { background: linear-gradient(#0e1116, #161b22 35%, #161b22 65%, #0e1116); border: 1px solid #30363d; border-radius: 10px; padding: 2px 6px; font-size: 11px; }
    .sector { display: flex; gap: 3px; height: 15px; line-height: 15px; }
    .sector.above, .sector.below { opacity: 0.3; transform: scaleY(0.6); height: 10px; line-height: 10px; }
    .w.passed { opacity: 0.45; }
    #drum-head { white-space: pre; font-size: 11px; }
    .sector.want { outline: 1px solid #fb923c; }
    .sector .sec { color: #8b949e; width: 4ch; }
    .sector .mark { width: 4ch; color: #facc15; font-weight: 700; }
    .sector.at-head { height: 20px; line-height: 20px; font-weight: 700; background: #2d2a12; border-top: 1px solid #facc15; border-bottom: 1px solid #facc15; }
    .sector .w { width: 3ch; text-align: right; }
    .w.under { background: #facc15; color: #0e1116; }
    .w.copied { color: #fb923c; font-weight: 700; opacity: 1; }
    #effect { background: #161b22; border: 1px solid #30363d; padding: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="bar">
    <select id="demo"></select>
    <button id="compile">Compile</button>
    <button id="back">&lt;- Back</button>
    <button id="step">Step -&gt;</button>
    <button id="run">Run</button>
    <button id="reset">Reset</button>
    <span id="status"></span>
    <span class="legend">
      <span><i style="background:#6e7681"></i>code</span>
      <span><i style="background:#3b82f6"></i>constant</span>
      <span><i style="background:#22c55e"></i>variable</span>
      <span><i style="background:#a855f7"></i>SUB arg / return</span>
      <span><i style="background:#f59e0b"></i>temp</span>
      <span><i class="box" style="outline:2px solid #22d3ee"></i>read</span>
      <span><i class="box" style="outline:2px solid #fb923c"></i>written</span>
    </span>
  </div>
  <div class="row" id="board">
    <svg id="arrow"></svg>
    <div>
      <div class="editor"><div id="lines"></div><textarea id="src" spellcheck="false" wrap="off"></textarea></div>
      <div class="head">EFFECT</div><div id="effect"></div>
      <pre id="out"></pre>
    </div>
    <div><div id="code"></div><div class="head" id="drum-head">DRUM</div><div id="drum"></div></div>
    <div id="ram"></div>
  </div>
  <script type="module" src="./visualizer.js"></script>
</body>
</html>
